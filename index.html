<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>und club / online rooms</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
.intro p{max-width:300px;word-break:keep-all}
</style>
<style>
:root{--ink:#20242a;--muted:#8b9198;--line:#e8ebee;--lime:#e6ff72;--pink:#ffb9dc;--sky:#a9e6ff;--cream:#fffdf5;--coral:#ff8d73}*{box-sizing:border-box}html,body{margin:0;background:#fff;color:var(--ink);font-family:"DM Sans","Apple SD Gothic Neo",sans-serif}button,input{font:inherit}button{cursor:pointer}.hidden{display:none!important}.page{min-height:100vh;padding:0 5vw}.shell{width:100%;max-width:1160px;margin:auto}header{height:78px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}.brand{display:flex;align-items:center;gap:9px;color:var(--ink);font-size:18px;font-weight:800;letter-spacing:-.06em}.brand i{height:12px;width:12px;background:var(--lime);border:1.5px solid var(--ink);display:block}.header-right{display:flex;gap:18px;color:var(--muted);font-size:11px}.online-dot{height:7px;width:7px;background:#91db64;border-radius:50%;display:inline-block;margin-right:5px}.user-chip{border-left:1px solid var(--line);padding-left:18px;color:var(--ink);font-weight:700}main{padding:72px 0 90px}.intro{display:flex;align-items:end;justify-content:space-between;margin-bottom:46px}.eyebrow{color:var(--muted);font-size:11px;font-weight:700;letter-spacing:.11em;text-transform:uppercase}.intro h1{font-size:clamp(48px,7vw,86px);letter-spacing:-.1em;line-height:.92;margin:17px 0 0}.intro h1 span{color:#ff80bd}.intro p{color:var(--muted);font-size:13px;line-height:1.7;margin:0;max-width:245px}.rooms{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.room-card{border:1px solid var(--line);min-height:335px;padding:22px;display:flex;flex-direction:column;justify-content:space-between;transition:.2s}.room-card:hover{border-color:var(--ink);transform:translateY(-4px)}.room-card:nth-child(1){background:var(--cream)}.room-card:nth-child(2){background:#f5fbfe}.room-card:nth-child(3){background:#fff8fb}.room-top{display:flex;justify-content:space-between}.room-index,.room-status{font-size:10px;color:var(--muted);font-weight:700}.room-status:before{content:"";width:6px;height:6px;background:#91db64;border-radius:50%;display:inline-block;margin-right:5px}.room-card h2{font-size:22px;letter-spacing:-.06em;margin:17px 0 8px}.room-card p{color:var(--muted);font-size:12px;margin:0;line-height:1.6}.room-art{height:130px;display:flex;align-items:center;justify-content:center}.plate{height:104px;width:104px;border:7px solid #cbd2d7;border-radius:50%;box-shadow:0 7px 0 #adb6bd;display:flex;align-items:center;justify-content:center;gap:6px;transform:rotate(-6deg)}.sushi{width:31px;height:47px;border:2px solid var(--ink);background:var(--coral);border-radius:6px 6px 12px 12px;position:relative}.sushi:before{content:"";position:absolute;height:14px;left:-2px;right:-2px;top:11px;background:#fff;border-top:2px solid var(--ink);border-bottom:2px solid var(--ink)}.sushi:nth-child(2){background:#ffca71;transform:translateY(8px) rotate(5deg)}.smoke{height:110px;width:80px;position:relative}.smoke:before,.smoke:after{content:"";position:absolute;border:1.5px solid var(--ink);border-radius:50%;height:43px;width:31px}.smoke:before{left:21px;top:43px;background:#d5f4ff}.smoke:after{left:38px;top:3px;border-color:#b4bcc1;border-bottom-color:transparent;transform:rotate(18deg)}.cig{position:absolute;width:75px;height:10px;background:#fff;border:1.5px solid var(--ink);left:4px;top:75px;transform:rotate(-13deg)}.cig:after{content:"";background:var(--coral);height:8px;width:10px;position:absolute;right:-1px;top:-1px}.ball{width:100px;height:100px;border:2px solid var(--ink);border-radius:48% 52% 54% 46%;background:var(--lime);position:relative;box-shadow:10px 12px 0 rgba(32,36,42,.08);transform:rotate(8deg)}.ball:before{content:"";position:absolute;width:27px;height:12px;left:20px;top:17px;background:#fff;border-radius:50%;opacity:.7}.ball:after{content:"";position:absolute;width:9px;height:9px;right:23px;bottom:23px;background:var(--pink);border:1px solid var(--ink);border-radius:50%;box-shadow:-34px -7px 0 var(--sky)}.enter{background:var(--ink);border:1px solid var(--ink);color:#fff;padding:12px 14px;text-align:left;font-size:12px;font-weight:700}.enter:hover{background:#fff;color:var(--ink)}
.room{display:grid;grid-template-columns:1fr 310px;min-height:650px;border:1px solid var(--line);background:#fbfbfb}.room-stage{display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}.stage-label{position:absolute;left:24px;top:22px;font-size:10px;color:var(--muted);font-weight:700;letter-spacing:.1em;text-transform:uppercase}.stage-label:before{content:"";display:inline-block;width:7px;height:7px;background:#91db64;border-radius:50%;margin-right:7px}.stage-object{position:relative}.sushi-stage{display:flex;align-items:end;transform:rotate(-7deg)}.sushi-stage .plate{width:230px;height:125px;gap:12px}.sushi-stage .sushi{width:54px;height:80px}.smoke-stage{width:160px;height:220px}.ball-stage{height:210px;width:210px}.ball-stage .ball{height:210px;width:210px}.presence{position:absolute;bottom:22px;left:24px;font-size:11px;color:var(--muted)}.chat{border-left:1px solid var(--line);background:#fff;display:flex;flex-direction:column}.chat-head{border-bottom:1px solid var(--line);padding:22px}.chat-head strong{display:block;font-size:14px}.chat-head span{color:var(--muted);display:block;font-size:11px;margin-top:5px}.messages{flex:1;overflow:auto;padding:18px 22px}.message{font-size:12px;line-height:1.5;margin-bottom:17px}.message b{display:block;font-size:10px;margin-bottom:3px}.message span{color:#5f656c}.message.me b{color:#ff72b5}.chat-form{border-top:1px solid var(--line);display:flex;padding:14px}.chat-form input{background:#f6f7f8;border:0;min-width:0;outline:0;padding:11px;width:100%;font-size:12px}.chat-form button{background:var(--lime);border:0;padding:0 14px;font-size:11px;font-weight:700}.back{background:transparent;border:0;color:var(--muted);font-size:11px;margin-bottom:18px;padding:0}.back:hover{color:var(--ink)}footer{border-top:1px solid var(--line);padding:22px 0;color:var(--muted);font-size:10px}.modal{background:rgba(255,255,255,.95);inset:0;position:fixed;z-index:5;display:grid;place-items:center}.login{border:1px solid var(--ink);background:#fff;padding:34px;width:min(390px,88vw)}.login h2{font-size:32px;letter-spacing:-.09em;margin:14px 0 8px}.login p{color:var(--muted);font-size:12px;line-height:1.6;margin:0 0 25px}.login form{display:flex;border-bottom:1px solid var(--ink)}.login input{border:0;outline:0;padding:12px 0;width:100%}.login button{background:var(--ink);border:0;color:#fff;padding:0 17px;font-size:12px}.toast{position:fixed;bottom:24px;left:50%;transform:translate(-50%,10px);background:var(--ink);color:#fff;opacity:0;padding:12px 18px;font-size:12px;pointer-events:none;transition:.25s}.toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:780px){.page{padding:0 6vw}header{height:68px}.header-right>span:first-child{display:none}main{padding:52px 0 65px}.intro{display:block;margin-bottom:32px}.intro p{margin-top:24px}.rooms{grid-template-columns:1fr}.room-card{min-height:260px}.room-art{height:105px}.room{display:block;min-height:0}.room-stage{height:440px}.chat{height:370px;border-left:0;border-top:1px solid var(--line)}.chat .messages{min-height:0}}
</style>
<style>
.rooms{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;max-height:560px;overflow-y:auto;padding:4px 8px 18px 2px;scroll-snap-type:y proximity}.rooms::-webkit-scrollbar{width:6px}.rooms::-webkit-scrollbar-thumb{background:var(--ink)}.room-card{min-width:0;scroll-snap-align:start}
.sushi-stage .sushi{cursor:pointer;transition:opacity .28s,transform .28s}.sushi-stage .sushi.eaten{opacity:0;transform:translateY(28px) scale(.2) rotate(25deg);pointer-events:none}.smoke-stage .cig{cursor:pointer;transition:filter .2s}.smoke-stage .cig:active{filter:brightness(1.35)}.smoke-puff{position:absolute;left:48px;top:42px;width:18px;height:18px;border:1px solid #aeb6bb;border-radius:50%;animation:drift 1.7s ease-out forwards;pointer-events:none}.smoke-puff:nth-child(2n){left:68px;animation-delay:.12s}.smoke-puff:nth-child(3n){left:35px;animation-delay:.22s}@keyframes drift{0%{opacity:.8;transform:translate(0,25px) scale(.45)}100%{opacity:0;transform:translate(18px,-78px) scale(1.7)}}.ball-stage .ball{cursor:grab;transition:transform .18s ease}.ball-stage .ball.dragging{cursor:grabbing;transition:none;transform:scale(.91,.84) rotate(-8deg)}
.room-art{transform:translateY(-12px)}.dance-stage{height:220px;width:220px;display:flex;align-items:center;justify-content:center}.dancer{position:relative;width:38px;height:92px;background:var(--pink);border:2px solid var(--ink);border-radius:20px 20px 11px 11px;animation:dance 1s ease-in-out infinite alternate}.dancer:before{content:"";position:absolute;width:34px;height:34px;background:var(--sky);border:2px solid var(--ink);border-radius:50%;left:0;top:-39px}.dancer:after{content:"";position:absolute;width:94px;height:13px;border-top:2px solid var(--ink);border-bottom:2px solid var(--ink);left:-28px;top:28px;transform:rotate(-24deg)}.dance-stage:after{content:"";position:absolute;width:150px;height:28px;border-bottom:2px solid var(--ink);border-radius:50%;animation:beat .5s ease-in-out infinite alternate}@keyframes dance{from{transform:rotate(-12deg) translateY(5px)}to{transform:rotate(12deg) translateY(-9px)}}@keyframes beat{from{transform:scaleX(.75)}to{transform:scaleX(1)}}
</style>
<style>.room-card .dancer{animation:none}.room-card .dance-stage{pointer-events:none}.room-stage .dancer{animation:none;cursor:pointer;transition:transform .25s ease}</style>
<style>.object-user{position:absolute;left:50%;top:100%;margin-top:12px;transform:translateX(-50%);color:var(--ink);font-size:11px;font-weight:700;letter-spacing:.02em;white-space:nowrap}</style>
</head>
<body>
<div class="page"><header class="shell"><a class="brand" href="#"><i></i>und club</a><div class="header-right"><span><i class="online-dot"></i><span id="onlineCount">1</span> online</span><span class="user-chip" id="userChip">guest</span></div></header>
<main class="shell"><section id="lobby"><div class="intro"><div><div class="eyebrow">online rooms / 01</div><h1>스트레스<br><span>풀자</span></h1></div></div><div class="rooms"><article class="room-card"><div><div class="room-top"><span class="room-index">ROOM 01</span><span class="room-status">open</span></div><h2>사이버 초밥집</h2><p>연어? 참치? 우니?<br>다 가능.</p></div><div class="room-art"><div class="plate"><i class="sushi"></i><i class="sushi"></i></div></div><button class="enter" data-room="sushi">입장하기 →</button></article><article class="room-card"><div><div class="room-top"><span class="room-index">ROOM 02</span><span class="room-status">open</span></div><h2>사이버 흡연장</h2><p>건강 걱정 ㄴㄴ</p></div><div class="room-art"><div class="smoke"><i class="cig"></i></div></div><button class="enter" data-room="smoke">입장하기 →</button></article><article class="room-card"><div><div class="room-top"><span class="room-index">ROOM 03</span><span class="room-status">open</span></div><h2>사이버 말랑이</h2><p>공짜말랑이</p></div><div class="room-art"><div class="ball"></div></div><button class="enter" data-room="soft">입장하기 →</button></article></div></section>
<section id="roomView" class="hidden"><button class="back" id="back">← 모든 방 보기</button><div class="room"><div class="room-stage" id="roomStage"><span class="stage-label" id="stageLabel">live room</span><div id="stageObject" class="stage-object"></div><span class="presence" id="presence">나 혼자 있어요</span></div><aside class="chat"><div class="chat-head"><strong id="roomTitle">사이버 초밥집</strong><span id="roomSub">지금 이 방에 있는 사람들</span></div><div class="messages" id="messages"></div><form class="chat-form" id="chatForm"><input id="chatInput" placeholder="메시지를 남겨보세요" autocomplete="off"><button>보내기</button></form></aside></div></section></main><footer class="shell">und club / online rooms</footer></div>
<div class="modal" id="loginModal"><div class="login"><div class="eyebrow">welcome to und club</div><h2>이름을 입력하세요.</h2><p>이 이름으로 다른 사람들에게 보여집니다.<br>언제든 방을 옮길 수 있어요.</p><form id="loginForm"><input id="nameInput" placeholder="예: 작은초밥" maxlength="16" autofocus required><button>입장</button></form></div></div><div class="toast" id="toast"></div>
<script>
const fallback=new BroadcastChannel('und-club-online');let socket=null,userName=localStorage.getItem('und-name')||'',currentRoom='',peerNames=[];
const rooms={sushi:{title:'사이버 초밥집',sub:'조용히 함께 먹는 저녁',label:'live sushi bar',html:'<div class="plate"><i class="sushi"></i><i class="sushi"></i><i class="sushi"></i></div>'},smoke:{title:'사이버 흡연장',sub:'잠깐 멈춰 서는 장소',label:'live smoking area',html:'<div class="smoke"><i class="cig"></i></div>'},soft:{title:'사이버 말랑이',sub:'같이 보고 만지는 시간',label:'live tactile room',html:'<div class="ball-stage"><div class="ball"></div></div>'}};
rooms.dance={title:'사이버 댄스룸',sub:'움직임을 공유하는 방',label:'live dance room',html:'<div class="dance-stage"><div class="dancer"></div></div>'};document.querySelector('.rooms').insertAdjacentHTML('beforeend','<article class="room-card"><div><div class="room-top"><span class="room-index">ROOM 04</span><span class="room-status">open</span></div><h2>사이버 댄스룸</h2><p>음악 없이도<br>일단 춤.</p></div><div class="room-art"><div class="dance-stage"><div class="dancer"></div></div></div><button class="enter" data-room="dance">입장하기 →</button></article>');
const $=id=>document.getElementById(id);function showToast(text){$('toast').textContent=text;$('toast').classList.add('show');clearTimeout(showToast.timer);showToast.timer=setTimeout(()=>$('toast').classList.remove('show'),1800)}
function send(message){if(socket&&socket.readyState===WebSocket.OPEN)socket.send(JSON.stringify(message));else fallback.postMessage(message)}
function connect(){if(location.protocol==='file:')return;socket=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host);socket.onmessage=event=>receive(JSON.parse(event.data));socket.onclose=()=>{socket=null;showToast('서버 연결이 끊어졌어요.');};}
function receive(data){if(data.type==='presence'&&data.room===currentRoom){peerNames=data.names.filter(name=>name!==userName);$('onlineCount').textContent=data.names.length;$('presence').textContent=data.names.length>1?data.names.length+'명이 함께 있어요 · '+data.names.slice(0,3).join(', '):'나 혼자 있어요';}if(data.type==='chat'&&data.room===currentRoom)addMessage(data.name,data.text,false);}
fallback.onmessage=event=>{if(socket)return;const data=event.data;if(data.type==='chat'&&data.room===currentRoom)addMessage(data.name,data.text,false);};
function setUser(){if(!userName)return;$('userChip').textContent=userName;$('loginModal').classList.add('hidden');connect();}
function enterRoom(room){currentRoom=room;$('lobby').classList.add('hidden');$('roomView').classList.remove('hidden');$('roomTitle').textContent=rooms[room].title;$('roomSub').textContent=rooms[room].sub;$('stageLabel').textContent=rooms[room].label;$('stageObject').innerHTML=rooms[room].html;$('stageObject').className='stage-object '+(room==='sushi'?'sushi-stage':room==='smoke'?'smoke-stage':'ball-stage');$('messages').innerHTML='<div class="message"><b>und club</b><span>이 방에 들어왔어요. 조용히 있어도 괜찮아요.</span></div>';send({type:'join',name:userName,room});}
function addMessage(name,text,mine){const item=document.createElement('div');item.className='message'+(mine?' me':'');item.innerHTML='<b></b><span></span>';item.querySelector('b').textContent=name;item.querySelector('span').textContent=text;$('messages').appendChild(item);$('messages').scrollTop=$('messages').scrollHeight;}
$('loginForm').addEventListener('submit',event=>{event.preventDefault();userName=$('nameInput').value.trim();if(userName){localStorage.setItem('und-name',userName);setUser();}});document.querySelectorAll('[data-room]').forEach(button=>button.addEventListener('click',()=>enterRoom(button.dataset.room)));$('back').addEventListener('click',()=>{$('roomView').classList.add('hidden');$('lobby').classList.remove('hidden');currentRoom='';send({type:'join',name:userName,room:''});});$('chatForm').addEventListener('submit',event=>{event.preventDefault();const input=$('chatInput'),text=input.value.trim();if(!text||!currentRoom)return;addMessage(userName,text,true);send({type:'chat',name:userName,text,room:currentRoom});input.value='';});if(userName){$('nameInput').value=userName;setUser();}
let interactionAudio;
function touchTone(kind){interactionAudio=interactionAudio||new(window.AudioContext||window.webkitAudioContext)();if(interactionAudio.state==='suspended')interactionAudio.resume();const oscillator=interactionAudio.createOscillator(),gain=interactionAudio.createGain();oscillator.type=kind==='crunch'?'square':kind==='sticky'?'sine':'triangle';oscillator.frequency.value=kind==='crunch'?95+Math.random()*75:kind==='sticky'?180:245;gain.gain.setValueAtTime(.0001,interactionAudio.currentTime);gain.gain.exponentialRampToValueAtTime(.07,interactionAudio.currentTime+.01);gain.gain.exponentialRampToValueAtTime(.0001,interactionAudio.currentTime+(kind==='crunch'?.08:.16));oscillator.connect(gain).connect(interactionAudio.destination);oscillator.start();oscillator.stop(interactionAudio.currentTime+(kind==='crunch'?.09:.17));}
function activateRoom(room){if(room==='sushi'){const sushiItems=[...document.querySelectorAll('.sushi-stage .sushi')];sushiItems.forEach(item=>item.addEventListener('click',()=>{if(item.classList.contains('eaten'))return;item.classList.add('eaten');touchTone('soft');if(sushiItems.every(sushi=>sushi.classList.contains('eaten'))){setTimeout(()=>{sushiItems.forEach(sushi=>sushi.classList.remove('eaten'));showToast('초밥이 다시 채워졌어요.');},750);}}));}if(room==='smoke'){const cigarette=document.querySelector('.smoke-stage .cig'),smoke=document.querySelector('.smoke-stage .smoke');cigarette.addEventListener('click',()=>{touchTone('crunch');for(let index=0;index<4;index++){const puff=document.createElement('i');puff.className='smoke-puff';smoke.appendChild(puff);setTimeout(()=>puff.remove(),1900);}});}if(room==='soft'){const ball=document.querySelector('.ball-stage .ball');let dragging=false,startX=0,startY=0;ball.addEventListener('pointerdown',event=>{dragging=true;startX=event.clientX;startY=event.clientY;ball.classList.add('dragging');ball.setPointerCapture?.(event.pointerId);touchTone('sticky')});ball.addEventListener('pointermove',event=>{if(!dragging)return;ball.style.transform=`translate(${(event.clientX-startX)/2}px,${(event.clientY-startY)/2}px) scale(.91,.84) rotate(-8deg)`});ball.addEventListener('pointerup',()=>{dragging=false;ball.classList.remove('dragging');ball.style.transform='';});}}
const originalEnterRoom=enterRoom;enterRoom=room=>{originalEnterRoom(room);activateRoom(room);};
</script>
<script>document.querySelector('.rooms').addEventListener('click',event=>{const button=event.target.closest('[data-room="dance"]');if(button)enterRoom('dance');});let danceStep=0;document.getElementById('roomStage').addEventListener('click',event=>{const dancer=event.target.closest('.room-stage .dancer');if(!dancer)return;danceStep++;const moves=[[-34,-7],[28,4],[-14,8],[38,-3],[0,-10]];const move=moves[danceStep%moves.length];dancer.style.transform=`translate(${move[0]}px,${move[1]}px) rotate(${danceStep%2?12:-12}deg)`;});const objectUser=document.createElement('span');objectUser.className='object-user';document.getElementById('roomStage').appendChild(objectUser);setInterval(()=>{objectUser.textContent=typeof userName==='string'&&userName?userName:'';},200);</script>
<script>const objectLabel=document.querySelector('.object-user'),stageObject=document.getElementById('stageObject');if(objectLabel&&stageObject){stageObject.appendChild(objectLabel);new MutationObserver(()=>{if(!stageObject.contains(objectLabel))stageObject.appendChild(objectLabel);}).observe(stageObject,{childList:true});}</script>
</body></html>
