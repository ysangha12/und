<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>und club / online rooms</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/styles.css">
</head>
<body>
<div class="page"><header class="shell"><a class="brand" href="#"><i></i>und club</a><div class="header-right"><span><i class="online-dot"></i><span id="onlineCount">1</span> online</span><span class="user-chip" id="userChip">guest</span></div></header>
<main class="shell"><section id="lobby"><div class="intro"><div><div class="eyebrow">online rooms / 01</div><h1>스트레스<br><span>풀자</span></h1></div></div><div class="rooms"><article class="room-card"><div><div class="room-top"><span class="room-index">ROOM 01</span><span class="room-status">open</span></div><h2>사이버 초밥집</h2><p>연어? 참치? 우니?<br>다 가능.</p></div><div class="room-art"><div class="plate"><i class="sushi"></i><i class="sushi"></i></div></div><button class="enter" data-room="sushi">입장하기 →</button></article><article class="room-card"><div><div class="room-top"><span class="room-index">ROOM 02</span><span class="room-status">open</span></div><h2>사이버 흡연장</h2><p>건강 걱정 ㄴㄴ</p></div><div class="room-art"><div class="smoke"><i class="cig"></i></div></div><button class="enter" data-room="smoke">입장하기 →</button></article><article class="room-card"><div><div class="room-top"><span class="room-index">ROOM 03</span><span class="room-status">open</span></div><h2>사이버 말랑이</h2><p>공짜말랑이</p></div><div class="room-art"><div class="ball"></div></div><button class="enter" data-room="soft">입장하기 →</button></article></div></section>
<section id="roomView" class="hidden"><button class="back" id="back">← 모든 방 보기</button><div class="room"><div class="room-stage" id="roomStage"><span class="stage-label" id="stageLabel">live room</span><div id="stageObject" class="stage-object"></div><span class="presence" id="presence">나 혼자 있어요</span></div><aside class="chat"><div class="chat-head"><strong id="roomTitle">사이버 초밥집</strong><span id="roomSub">지금 이 방에 있는 사람들</span></div><div class="messages" id="messages"></div><form class="chat-form" id="chatForm"><input id="chatInput" placeholder="메시지를 남겨보세요" autocomplete="off"><button>보내기</button></form></aside></div></section></main><footer class="shell">und club / online rooms</footer></div>
<div class="modal" id="loginModal"><div class="login"><div class="eyebrow">welcome to und club</div><h2>이름을 입력하세요.</h2><p>이 이름으로 다른 사람들에게 보여집니다.<br>언제든 방을 옮길 수 있어요.</p><form id="loginForm"><input id="nameInput" placeholder="예: 작은초밥" maxlength="16" autofocus required><button>입장</button></form></div></div><div class="toast" id="toast"></div>
<script src="/app.js" defer></script>
</body></html>
